name: Dependency auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       github.event.pull_request.user.login == 'renovate[bot]') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Metadata only: never check out or execute the PR's code with this token.
      - name: Enable auto-merge after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Refuse to merge if the required CI gate has not been configured.
          gh api "repos/$GH_REPO/branches/${{ github.event.pull_request.base.ref }}" \
            --jq '.protection.required_status_checks.contexts | index("test") != null' \
            | grep -qx true
          gh pr merge "$PR_NUMBER" --auto --squash
